[package]
name = "hr-chat-start"
version = "0.1.0"
edition = "2024"
publish = false
description = "Starts an Amazon Connect chat for /p/hr/ (guppi-hr D55)"

[[bin]]
name = "hr-chat-start"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client", "credentials-process"] }
aws-sdk-bedrockagentcore = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-connect = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-connectparticipant = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
base64 = "0.22"
futures = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
lambda_runtime = "1"
num-bigint = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[dev-dependencies]
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Key generation in the tests is slow unoptimized.
[profile.dev.package."*"]
opt-level = 3
