[project]
name = "guppi-connect-infra"
version = "0.1.0"
description = "AWS CDK app for the guppi-connect spike"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.230",
    "constructs>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guppi_connect_infra"]
