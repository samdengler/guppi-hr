[project]
name = "connect-bridge"
version = "0.1.0"
description = "AG-UI to Amazon Connect chat bridge, an agent project on chat.dengler.io"
requires-python = ">=3.12"
dependencies = [
    "guppi-agent @ git+https://github.com/samdengler/guppi-gpt@kit-v0.3.0#subdirectory=agent",
    "boto3>=1.40",
    "websocket-client>=1.8",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connect_bridge"]

[tool.hatch.metadata]
allow-direct-references = true
