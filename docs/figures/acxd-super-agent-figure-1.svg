)"></path><path d="M480 350H612V232" marker-end="url(#acxd-arrow)"></path><path d="M280 350H248" marker-end="url(#acxd-arrow)"></path><path d="M380 380V420" marker-end="url(#acxd-arrow)"></path><path d="M380 400H612V420" marker-end="url(#acxd-arrow)"></path><path d="M280 450H248" marker-end="url(#acxd-arrow)"></path><path d="M148 480V500H330V480" marker-end="url(#acxd-arrow)"></path><path d="M380 480V604" marker-end="url(#acxd-arrow)"></path><path d="M612 480V604" marker-end="url(#acxd-arrow)"></path><path d="M380 664V704" marker-end="url(#acxd-arrow)"></path><path d="M460 704V684H540V664" marker-end="url(#acxd-arrow)"></path><path d="M640 664V704" marker-end="url(#acxd-arrow)"></path></g><g data-claude-anchor="channel-web"><rect x="48" y="76" width="200" height="44" rx="8" fill="none" fill-opacity="1" stroke="#587089" stroke-width="1.25" stroke-dasharray="none"></rect><text data-claude-text-id="ch-web" x="148" y="102" text-anchor="middle" fill="#12263f">Web chat, Touchpoint</text></g><g data-claude-anchor="channel-voice"><rect x="280" y="76" width="200" height="44" rx="8" fill="none" fill-opacity="1" stroke="#587089" stroke-width="1.25" stroke-dasharray="none"></rect><text data-claude-text-id="ch-voice" x="380" y="102" text-anchor="middle" fill="#12263f">Voice</text></g><g data-claude-anchor="channel-messaging"><rect x="512" y="76" width="200" height="44" rx="8" fill="none" fill-opacity="1" stroke="#587089" stroke-width="1.25" stroke-dasharray="none"></rect><text data-claude-text-id="ch-msg" x="612" y="102" text-anchor="middle" fill="#12263f">SMS, WhatsApp</text></g><g data-claude-anchor="flow"><rect x="48" y="172" width="200" height="60" rx="8" fill="none" fill-opacity="1" stroke="#587089" stroke-width="1.25" stroke-dasharray="5 4"></rect><text data-claude-text-id="flow-name" x="148" y="196" text-anchor="middle" font-weight="600" fill="#12263f">Contact flow</text><text data-claude-text-id="flow-body" x="148" y="214" text-anchor="middle" font-size="11.5" fill="#587