[project]
name = "hr-agent"
version = "0.1.0"
description = "HR Super Agent agent: AG-UI over SSE on the AgentCore Runtime contract"
requires-python = ">=3.12"
dependencies = [
    "ag-ui-protocol>=0.1.22",
    "ag-ui-strands>=0.3.0",
    "aws-opentelemetry-distro>=0.18.0",
    "bedrock-agentcore>=1.0",
    "boto3>=1.43.87",
    "fastapi>=0.115",
    "mcp>=1.29",
    "pyjwt[crypto]>=2.10",
    "strands-agents[a2a]>=1.54.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "moto[dynamodb]>=5.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hr_agent"]
