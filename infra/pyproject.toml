[project]
name = "hr-super-agent-infra"
version = "0.1.0"
description = "AWS CDK app for HR Super Agent"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.230",
    "constructs>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hr_super_agent_infra"]
